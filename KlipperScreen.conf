# =============================================================================
# EOS | KlipperScreen | Voron 2.4r2 350 | aTSS AWD + Smart Orbiter 3.5
# =============================================================================
# Menus are intentionally organized by workflow instead of Klipper module.
# This file defines a complete idle menu, with no duplicated default entries.
# Print-status controls (pause / resume / cancel) remain in the job-status UI.
#
# PHYSICAL ROUTING (NOT original aTSS logical group labels):
#   X  / A0 / rear-right  / HV0 / lower belt
#   X1 / A1 / front-left  / HV2 / lower belt
#   Y  / B0 / rear-left   / HV1 / upper belt
#   Y1 / B1 / front-right / HV3 / upper belt
#
# Be careful: STEPPER_BUZZ operates on a mechanically coupled AWD belt.
# Do not buzz during a print or if an XY motor/cable is loose or damaged.
# Front motor thermistors TH4 / TH5 are not wired yet; no menu entries for them.
# =============================================================================

[main]
use_default_menu: False

[printer EOSv2.X]
z_babystep_values: 0.005, 0.01

# =============================================================================
# PREHEAT PRESETS | shown in KlipperScreen Temperature panel
# =============================================================================
[preheat PLA]
extruder: 225
heater_bed: 70

[preheat PETG]
extruder: 240
heater_bed: 80

[preheat ABS]
extruder: 240
heater_bed: 110

[preheat ASA]
extruder: 250
heater_bed: 110

# =============================================================================
# MAIN | 1. PRINT FILES
# =============================================================================
[menu __main print]
name: Print Files
icon: printer
panel: gcodes

# =============================================================================
# MAIN | 2. PREPARE & HOME
# Ordinary G28 uses Beacon proximity; contact is explicit under Calibrate.
# =============================================================================
[menu __main prepare]
name: Prepare & Home
icon: home

[menu __main prepare home_all]
name: Home XYZ (Proximity)
icon: home
method: printer.gcode.script
params: {"script":"G28"}

[menu __main prepare home_xy]
name: Home X + Y
icon: move
method: printer.gcode.script
params: {"script":"G28 X Y"}

[menu __main prepare home_z]
name: Home Z (Proximity)
icon: home
method: printer.gcode.script
params: {"script":"G28 Z"}

[menu __main prepare temperature]
name: Temperature / Preheat
icon: heat-up
panel: temperature

[menu __main prepare preheat_filament]
name: Preheat Selected Filament
icon: heat-up
method: printer.gcode.script
params: {"script":"PREHEAT"}
enable: {{ 'PREHEAT' in printer.gcode_macros.list }}

[menu __main prepare heatsoak]
name: Heat Soak (100C / 40C)
icon: heat-up
method: printer.gcode.script
params: {"script":"HEAT_SOAK TARGET=100 CHAMBER=40 DURATION=10"}
confirm: 'Start bed/chamber heat soak? Check the HEAT_SOAK macro and chamber sensor first.'
enable: {{ 'HEAT_SOAK' in printer.gcode_macros.list }}

[menu __main prepare stop_heatsoak]
name: Cancel Heat Soak
icon: cool-down
method: printer.gcode.script
params: {"script":"CANCEL_HEAT_SOAK"}
enable: {{ 'CANCEL_HEAT_SOAK' in printer.gcode_macros.list }}

[menu __main prepare cooldown]
name: Turn Off Heaters
icon: cool-down
method: printer.gcode.script
params: {"script":"TURN_OFF_HEATERS"}

