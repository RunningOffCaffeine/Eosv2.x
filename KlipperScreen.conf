icon: info
method: printer.gcode.script
params: {"script":"SHOW_BUILD_SHEET"}

[menu __main calibrate sheets list]
name: Show All Sheets
icon: info
method: printer.gcode.script
params: {"script":"SHOW_BUILD_SHEETS"}

[menu __main calibrate sheets edit]
name: Edit Saved Sheet Offset
icon: custom-script
panel: gcode_macros
# Use SET_BUILD_SHEET_OFFSET in the macro panel to enter an actual number.
# An old direct menu call used OFFSET=%s, which KlipperScreen does NOT prompt for.

[menu __main calibrate sheets reset]
name: Zero Saved Sheet Offset
icon: z-farther
method: printer.gcode.script
params: {"script":"SET_BUILD_SHEET_OFFSET OFFSET=0"}
confirm: 'Permanently reset the saved offset of the installed sheet to zero?'

