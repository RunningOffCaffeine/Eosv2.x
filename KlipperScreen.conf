[menu __main calibrate adaptive_mesh]
name: Adaptive Bed Mesh
icon: bed-mesh
method: printer.gcode.script
params: {"script":"MESH_CALIBRATE RUNS=2"}

[menu __main calibrate mesh_panel]
name: Inspect Bed Mesh
icon: bed-mesh
panel: bed_mesh

[menu __main calibrate beacon]
name: Beacon Z (Contact)
icon: z-farther

[menu __main calibrate beacon contact_calibrate]
name: Contact + Calibrate Model
icon: z-farther
method: printer.gcode.script
params: {"script":"G28 Z METHOD=CONTACT CALIBRATE=1"}
confirm: 'Physical nozzle contact: verify installed sheet, clean nozzle, homed XY, safe nozzle temperature.'

[menu __main calibrate beacon contact_only]
name: Contact Z (No Calibration)
icon: z-farther
method: printer.gcode.script
params: {"script":"G28 Z METHOD=CONTACT CALIBRATE=0"}
confirm: 'Physical nozzle contact without recalibration: is the nozzle clean and the bed clear?'

[menu __main calibrate sheets]
name: Build Sheets
icon: bed-level

[menu __main calibrate sheets smooth]
name: Install Smooth PEI
method: printer.gcode.script
