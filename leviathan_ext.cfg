# =============================================================================
# EOS | Leviathan V1.3 Extension Board | aTinyShellScript AWD CoreXY
# =============================================================================
# PHYSICAL WIRING:
#
#   Rear right   | A0 | Lower belt | stepper_x  | Mainboard HV0
#   Front left   | A1 | Lower belt | stepper_x1 | Extension HV2
#   Rear left    | B0 | Upper belt | stepper_y  | Mainboard HV1
#   Front right  | B1 | Upper belt | stepper_y1 | Extension HV3
#
# aTSS A/B labels refer to PHYSICAL belt paths. The logical Klipper X/Y groups
# are intentionally reversed relative to the specific cabling arrangement.
# =============================================================================

# -----------------------------------------------------------------------------
# A1 | Front-left AWD motor | Lower belt | Extension HV STEPPER 2
# Paired with rear-right A0 (stepper_x, mainboard HV0).
# -----------------------------------------------------------------------------
[stepper_x1]
step_pin: PD15
dir_pin: PD14
enable_pin: !PG2
rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 200
high_precision_step_compress: True

[tmc5160 stepper_x1]
cs_pin: PB12
spi_software_mosi_pin: PB15
spi_software_miso_pin: PB14
spi_software_sclk_pin: PB13
diag0_pin: ^!PG3
interpolate: false
driver_SGT: 2
run_current: 2.235
home_current: 0.560
current_change_dwell_time: 0.5
sense_resistor: 0.075
stealthchop_threshold: 0

# -----------------------------------------------------------------------------
# B1 | Front-right AWD motor | Upper belt | Extension HV STEPPER 3
# Paired with rear-left B0 (stepper_y, mainboard HV1).
# -----------------------------------------------------------------------------
[stepper_y1]
step_pin: PG4
dir_pin: PE8
enable_pin: !PB0
rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 200
high_precision_step_compress: True

[tmc5160 stepper_y1]
cs_pin: PG5
spi_software_mosi_pin: PB15
spi_software_miso_pin: PB14
spi_software_sclk_pin: PB13
diag0_pin: ^!PE7
interpolate: false
driver_SGT: 3
run_current: 2.235
home_current: 0.560
current_change_dwell_time: 0.5
sense_resistor: 0.075
stealthchop_threshold: 0

# -----------------------------------------------------------------------------
# Mainboard AWD motor thermistors | REFERENCE ONLY (defined in printer.cfg)
# -----------------------------------------------------------------------------
# These inputs are on the Leviathan MAINBOARD, not the extension board.
# Keep the reference sections commented out to avoid duplicate sensor names.
#
# HV0 | A0 | Rear-right | Lower belt | stepper_x | TH2 / PA0
# [temperature_sensor Motor_A0]
# sensor_type: ATC Semitec 104GT-2
# sensor_pin: PA0
# min_temp: 0
# max_temp: 180
# pullup_resistor: 2200
#
# HV1 | B0 | Rear-left | Upper belt | stepper_y | TH3 / PA3
# [temperature_sensor Motor_B0]
# sensor_type: ATC Semitec 104GT-2
# sensor_pin: PA3
# min_temp: 0
# max_temp: 180
# pullup_resistor: 2200

# -----------------------------------------------------------------------------
# Extension AWD motor thermistors | ACTUAL IMPLEMENTATION (defined here)
# -----------------------------------------------------------------------------
# HV2 | A1 | Front-left | Lower belt | stepper_x1 | TH4 / PC4
# [temperature_sensor Motor_A1]
# sensor_type: ATC Semitec 104GT-2
# sensor_pin: PC4
# min_temp: 0
# max_temp: 180
# pullup_resistor: 2200
# 
# HV3 | B1 | Front-right | Upper belt | stepper_y1 | TH
# [temperature_sensor Motor_B1]
# sensor_type: ATC Semitec 104GT-2
# sensor_pin: PC5
# min_temp: 0
# max_temp: 180
# pullup_resistor: 2200



# -----------------------------------------------------------------------------
# Extension buzzer | PB1
# -----------------------------------------------------------------------------
[pwm_cycle_time _beeper]
pin: PB1
shutdown_value: 0
value: 0
