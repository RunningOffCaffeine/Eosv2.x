# EOS | Leviathan V1.3 extension board
# Front AWD motors live here.
# stepper_x1 (front right) and stepper_y1 (front left)
# -----------------------------------------------------------------------------
# B1 | Front-right AWD X motor | HV STEPPER 3
# -----------------------------------------------------------------------------

[stepper_x1]
step_pin: PG4
dir_pin: PE8
enable_pin: !PB0
rotation_distance: 40
microsteps: 64
high_precision_step_compress: True

# LDO Kraken AWD
full_steps_per_rotation: 200  #set to 200 for 1.8 degree stepper

[tmc5160 stepper_x1]
cs_pin: PG5
# spi_bus: spi2
spi_software_mosi_pin: PB15
spi_software_miso_pin: PB14
spi_software_sclk_pin: PB13
diag0_pin: ^!PE7
interpolate: true
driver_SGT: 3
# LDO Kraken AWD
run_current: 2.235 # MOTOR peak 2.94A (75%), DRIVER peak 4.44A
home_current: 0.560
current_change_dwell_time: 0.5
sense_resistor: 0.075
stealthchop_threshold: 0

# -----------------------------------------------------------------------------
# A1 | Front-left AWD Y motor | HV STEPPER 2
# -----------------------------------------------------------------------------
[stepper_y1]
step_pin: PD15
dir_pin: PD14
enable_pin: !PG2
rotation_distance: 40
microsteps: 64
high_precision_step_compress: True

# LDO Kraken AWD
full_steps_per_rotation: 200  #set to 200 for 1.8 degree stepper

[tmc5160 stepper_y1]
cs_pin: PB12
# spi_bus: spi2
spi_software_mosi_pin: PB15
spi_software_miso_pin: PB14
spi_software_sclk_pin: PB13
diag0_pin: ^!PG3
interpolate: true
driver_SGT: 2
# LDO Kraken AWD
run_current: 2.235 # MOTOR peak 2.94A (75%), DRIVER peak 4.44A
home_current: 0.560
current_change_dwell_time: 0.5
sense_resistor: 0.075
stealthchop_threshold: 0

# Spare extension fan/thermistor header examples intentionally omitted.
# Those connections are unassigned and do not affect active hardware.

# -----------------------------------------------------------------------------
# Extension buzzer
# -----------------------------------------------------------------------------

[pwm_cycle_time _beeper]
## Passive Buzzer - varying cycle time varies the pitch
pin: PB1
shutdown_value: 0
value: 0
