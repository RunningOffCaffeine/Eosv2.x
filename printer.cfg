# EOS | Voron 2.4r2 350 mm | Leviathan V1.3 + SO3 toolboard
# Mainboard, AWD rear motors, Z/QGL, Beacon, bed and auxiliary devices live here.
# SO3 toolhead/extruder hardware is configured only in SO3.cfg.
# Leviathan extension/front AWD motors are configured only in leviathan_ext.cfg.

[include mainsail.cfg]
[include spoolman.cfg]
[include leviathan_ext.cfg]
[include SO3.cfg]
[include macros.cfg]

[display_status]

[pause_resume]
recover_velocity: 250

[exclude_object]

[save_variables]
filename: ~/printer_data/variables.cfg

[virtual_sdcard]
path: ~/printer_data/gcodes

[change_nozzle]

[auto_speed]

[gcode_arcs]

[axis_twist_compensation]
calibrate_start_x: 50
calibrate_end_x: 300
calibrate_y: 175

calibrate_start_y: 50
calibrate_end_y: 300
calibrate_x: 175

[danger_options]
allow_plugin_override: True

# -----------------------------------------------------------------------------
# Leviathan MCU and host monitoring
# -----------------------------------------------------------------------------

[mcu]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
# -----------------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_stm32h743xx_4B0036000651323439333335-if00
restart_method: rpi_usb

[temperature_sensor Leviathan]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100
# -----------------------------------------------------------------------------

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

[printer]
kinematics: limited_corexy
max_velocity: 250
max_accel: 8000
max_x_accel: 8000
max_y_accel: 8000
scale_xy_accel: True
max_z_velocity: 30          # Max 15 for 12V TMC Drivers, can increase for 24V (testing 30)
max_z_accel: 300
square_corner_velocity: 8.0

# -----------------------------------------------------------------------------
#   X/Y Stepper Settings
# -----------------------------------------------------------------------------

##  B0 Stepper - Left Rear
##  Connected to HV STEPPER 0
##  Sensorless X homing via TMC5160 virtual endstop
[stepper_x]
step_pin: PB10
dir_pin: !PB11
enable_pin: !PG0
rotation_distance: 40
microsteps: 64
high_precision_step_compress: True

# LDO Kraken AWD
full_steps_per_rotation: 200  #set to 200 for 1.8 degree stepper

endstop_pin: tmc5160_stepper_x:virtual_endstop
position_min: 11
position_endstop: 350
position_max: 351
homing_speed: 100
homing_positive_dir: true
use_sensorless_homing: true
homing_retract_dist: 10

##  Make sure to update below for your relevant driver (2209 or 5160)
[tmc5160 stepper_x]
cs_pin: PE15
spi_software_mosi_pin: PE14
spi_software_miso_pin: PE13
spi_software_sclk_pin: PE12
interpolate: true
diag0_pin: ^!PG1
driver_SGT: 3
# LDO Kraken AWD
run_current: 2.235 # MOTOR peak 2.94A (75%), DRIVER peak 4.44A
home_current: 0.560
current_change_dwell_time: 0.5
sense_resistor: 0.075
stealthchop_threshold: 0

# [temperature_sensor Motor_B0]
# ##  Temperature Sensor - TH2
# ## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
# sensor_type: ATC Semitec 104GT-2
# sensor_pin: PA0
# min_temp: 0
# max_temp: 300
# pullup_resistor: 2200

##  A0 Stepper - Right Rear
##  Connected to HV STEPPER 1
##  Sensorless Y homing via TMC5160 virtual endstop
[stepper_y]
step_pin: PF15
dir_pin: !PF14
enable_pin: !PE9
rotation_distance: 40
microsteps: 64
high_precision_step_compress: True

# LDO Kraken AWD
full_steps_per_rotation: 200  #set to 200 for 1.8 degree stepper

endstop_pin: tmc5160_stepper_y:virtual_endstop
position_min: 0
position_endstop: 350
position_max: 351
homing_speed: 100
homing_positive_dir: true
use_sensorless_homing: true
homing_retract_dist: 10

##  Make sure to update below for your relevant driver (2209 or 5160)
[tmc5160 stepper_y]
cs_pin: PE11
spi_software_mosi_pin: PE14
spi_software_miso_pin: PE13
spi_software_sclk_pin: PE12
interpolate: true
diag0_pin: ^!PE10
driver_SGT: 3
# LDO Kraken AWD
run_current: 2.235 # MOTOR peak 2.94A (75%), DRIVER peak 4.44A
home_current: 0.560
current_change_dwell_time: 0.5
sense_resistor: 0.075
stealthchop_threshold: 0

# [temperature_sensor Motor_A0]
# ##  Temperature Sensor - TH3
# ## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
# sensor_type: ATC Semitec 104GT-2
# sensor_pin: PA3
# min_temp: 0
# max_temp: 300
# pullup_resistor: 2200

# -----------------------------------------------------------------------------
#   Z Stepper Settings
# -----------------------------------------------------------------------------

## Z0 Stepper - Front Left
##  Connected to STEPPER 0
##  Endstop connected to Z-ENDSTOP
[stepper_z]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD7
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128

# Beacon Endstop
endstop_pin: probe:z_virtual_endstop # use beacon as virtual endstop
homing_retract_dist: 0 # beacon needs 0

#  Uncomment below for 350mm build
position_max: 330

position_min: -10
homing_speed: 10
second_homing_speed: 1

##  Make sure to update below for your relevant driver (2209 or 5160)
[tmc2209 stepper_z]
uart_pin: PD5
# diag_pin: ^!PD6
interpolate: false
run_current: 1.287 # MOTOR/DRIVER peak 1.96A (65%)
sense_resistor: 0.110
stealthchop_threshold: 1000

##  Z1 Stepper - Rear Left
##  Connected to STEPPER 1
[stepper_z1]
step_pin: PC12
dir_pin: PC11
enable_pin: !PD2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128

##  Make sure to update below for your relevant driver (2209 or 5160)
[tmc2209 stepper_z1]
uart_pin: PD0
# diag_pin: ^!PD1
interpolate: false
run_current: 1.287 # MOTOR/DRIVER peak 1.96A (65%)
sense_resistor: 0.110
stealthchop_threshold: 1000

##  Z2 Stepper - Rear Right
##  Connected to STEPPER 2
[stepper_z2]
step_pin: PC9
dir_pin: !PC8
enable_pin: !PC10
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128

##  Make sure to update below for your relevant driver (2209 or 5160)
[tmc2209 stepper_z2]
uart_pin: PA8
# diag_pin: ^!PA15
interpolate: false
run_current: 1.287 # MOTOR/DRIVER peak 1.96A (65%)
sense_resistor: 0.110
stealthchop_threshold: 1000

##  Z3 Stepper - Front Right
##  Connected to STEPPER 3
[stepper_z3]
step_pin: PG7
dir_pin: PG6
enable_pin: !PC7
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128

##  Make sure to update below for your relevant driver (2209 or 5160)
[tmc2209 stepper_z3]
uart_pin: PG8
# diag_pin: ^!PC6
interpolate: false
run_current: 1.287 # MOTOR/DRIVER peak 1.96A (65%)
sense_resistor: 0.110
stealthchop_threshold: 1000

# -----------------------------------------------------------------------------
#   Bed Heater
# -----------------------------------------------------------------------------

[heater_bed]
##  SSR Pin - HEATBED
##  Thermistor - TH1
heater_pin: PG11
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PA2
pullup_resistor: 2200
##  Adjust Max Power so your heater doesn't warp your bed. Rule of thumb is 0.4 watts / cm^2 .
max_power: 0.7 # 525W / 1225 cm^2 = 0.428 W/cm^2
min_temp: 0
max_temp: 120
pwm_cycle_time: 0.01666

control: pid
pid_kp: 55.527
pid_ki: 2.783
pid_kd: 276.940

# cooling_fan: chamber_filter # Nevermore StealthMax v2

[verify_heater heater_bed]
check_gain_time: 120

# -----------------------------------------------------------------------------
#   Probe
# -----------------------------------------------------------------------------

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_03B4D66C5154354D38202020FF0A2E1F-if00
x_offset: 0  # update with offset from SO3 nozzle
y_offset: 28 # upupdate with offset from SO3 nozzle
# backlash_comp: 0.01 # use BEACON_ESTIMATE_BACKLASH
speed: 2
mesh_main_direction: x
mesh_runs: 2

accel_axes_map: -x, -y, z # update after SO3 installation
# `-x, -y, z` is beacon behind nozzle, facing front of printer.

# Beacon contact z-offset configs
contact_max_hotend_temperature: 300 # increase to probe at print temps
contact_mesh_min: 30, 70 # x, y
contact_mesh_max: 325, 325 # x, y

home_xy_position: 175,175 # update with your safe position
home_y_before_x: true # always home Y first, then X, then Z to avoid AWD motors.
home_z_hop: 5
home_z_hop_speed: 30
home_xy_move_speed: 125
home_method: contact # use contact for first home
home_method_when_homed: proximity # after initial calibration use induction
home_autocalibrate: unhomed # contact will calibrate beacon on first home
autocal_tolerance: 0.008 # 0.008 std
autocal_max_retries: 10

# -----------------------------------------------------------------------------
#   Fan Control
# -----------------------------------------------------------------------------

[controller_fan MCU_fan]
##  Controller fan - FAN2
pin: PF7
##tachometer_pin: PF6
kick_start_time: 0.5
max_power: 0.75
cycle_time: 0.01666 # PWM Frequency (60hz USA)
heater: heater_bed

[fan_generic chamber_filter]
##  Exhaust fan - FAN3
pin: PF9
#tachometer_pin: PF8
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
cycle_time: 0.01666 # PWM Frequency (60hz USA)
# heater: heater_bed
# heater_temp: 60
# fan_speed: 0.0

# -----------------------------------------------------------------------------
#   LED Control
# -----------------------------------------------------------------------------

## Chamber Lighting (Optional)
## Connected to LED-STRIP
[output_pin caselight]
pin: PE6
pwm: True
value: 0.25 # Startup value
shutdown_value: 0
cycle_time: 0.001 # PWM Frequency (1Khz)

# -----------------------------------------------------------------------------
#   Accelerometer
# -----------------------------------------------------------------------------
[resonance_tester]
accel_chip: beacon
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0
probe_points: 175, 175, 20
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
#   TH
# -----------------------------------------------------------------------------

# Nitehawk removal: the Chamber thermistor previously used nhk:gpio28.
# DO NOT enable this section until the thermistor has been physically rewired
# to a verified free thermistor input and sensor_pin is updated.
# HEAT_SOAK / M191 macros referencing "temperature_sensor Chamber" must not
# be called until the sensor is restored (unless those macros are revised).
# [temperature_sensor Chamber]
# sensor_type: ATC Semitec 104NT-4-R025H42G
# sensor_pin: <rewired-verified-thermistor-input>
# min_temp: 0
# max_temp: 100
# gcode_id: chamber_th

# -----------------------------------------------------------------------------
#   Homing and Gantry Adjustment Routines
# -----------------------------------------------------------------------------

[idle_timeout]
timeout: 3600

##  Use QUAD_GANTRY_LEVEL to level a gantry.
##  Min & Max gantry corners - measure from nozzle at MIN (0,0) and
##  MAX (250, 250), (300,300), or (350,350) depending on your printer size
##  to respective belt positions

[quad_gantry_level]
#  Gantry Corners for 350mm Build
#  Uncomment for 350mm build
gantry_corners:
    -60,-10
    410,420

# gantry_corners:
#     -71.7193, -42.1093
#     423.6409, 407.3017

#  Probe points
points:
    75,  75
    75,  275
    275, 275
    275, 75

speed: 350
horizontal_move_z: 5
retries: 10
retry_tolerance: 0.0050 ## 0.0075 standard
max_adjust: 10.0
adaptive_horizontal_move_z: True
min_horizontal_move_z: 0.0

[bed_mesh]
# speed: 650
speed: 550
horizontal_move_z: 5
mesh_min: 25, 70
mesh_max: 325,325
zero_reference_position: 175, 175 # Bed Center
fade_start: 1.0
fade_end: 10.0
probe_count: 50, 50
mesh_pps: 2, 2
algorithm: bicubic
bicubic_tension: 0.2
move_check_distance: 3
split_delta_z: 0.1
adaptive_margin: 3

