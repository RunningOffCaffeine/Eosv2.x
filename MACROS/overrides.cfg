[gcode_macro M117]
rename_existing: M117.1
gcode:
    # 1. Display the message using the original command
    M117.1 {rawparams}
    
    # 2. Check if this is an Alert or Error message
    # We check for common keywords/characters used in errors
    {% set is_alert = ('!!' in rawparams) or ('Error' in rawparams) or ('ALERT' in rawparams) %}
    
    # 3. Handle the Auto-Clear Logic
    # Always reset the timer first to prevent premature clearing of a new message
    UPDATE_DELAYED_GCODE ID=_CLEAR_M117 DURATION=0
    
    {% if not is_alert %}
        # If it's NOT an alert, schedule the clear for 30 seconds
        UPDATE_DELAYED_GCODE ID=_CLEAR_M117 DURATION=30
    {% endif %}


[delayed_gcode _CLEAR_M117]
gcode:
    # Clear the display by sending an empty M117 command
    M117.1


[gcode_macro M109] # Wait Hotend Temp
rename_existing: M109.1
gcode:
    #Parameters
    {% set s = params.S|float %}

    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  # Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s-1} MAXIMUM={s+2}   # Wait for hotend temp (within n degrees)
    {% endif %}


[gcode_macro M190] # Wait Bed Temp
rename_existing: M190.1
gcode:
    #Parameters
    {% set s = params.S|float %}

    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}   # Set bed temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s-1} MAXIMUM={s+2}  # Wait for bed temp (within n degrees)
    {% endif %}


[gcode_macro M191] # Wait Chamber Temp
# rename_existing: M191.1
gcode:
    #Parameters
    {% set s = params.S|float %}

    M141 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}   # Set chamber temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR="temperature_sensor Chamber" MINIMUM={s-1} MAXIMUM={s+2}  # Wait for chamber temp (within n degrees)
    {% endif %}

    
[gcode_macro G32]
gcode:
    CG28
    QUAD_GANTRY_LEVEL {rawparams}


[gcode_macro G29]
gcode:
    CG28
    MESH_CALIBRATE {rawparams}



[gcode_macro G28]
description: Proximity homing by default; contact/calibration on request
rename_existing: G28.1
gcode:
    {% set TOKENS = rawparams.upper().split() %}

    # --- Default behavior ---
    {% set ns = namespace(
        HOME_X=False,
        HOME_Y=False,
        HOME_Z=False,
        METHOD="PROXIMITY",
        CALIBRATE=0
    ) %}

    # --- Parse axes and Beacon parameters ---
    {% for t in TOKENS %}
        {% if t.startswith("METHOD=") %}
            {% set ns.METHOD = t.split("=", 1)[1] %}
        {% elif t.startswith("CALIBRATE=") %}
            {% set ns.CALIBRATE = t.split("=", 1)[1]|int %}
        {% elif t.startswith("X") %}
            {% set ns.HOME_X = True %}
        {% elif t.startswith("Y") %}
            {% set ns.HOME_Y = True %}
        {% elif t.startswith("Z") %}
            {% set ns.HOME_Z = True %}
        {% endif %}
    {% endfor %}

    # --- Validate parameters ---
    {% if ns.METHOD not in ["PROXIMITY", "CONTACT"] %}
        {action_raise_error("G28 METHOD must be CONTACT or PROXIMITY")}
    {% endif %}

    {% if ns.CALIBRATE not in [0, 1] %}
        {action_raise_error("G28 CALIBRATE must be 0 or 1")}
    {% endif %}

    {% if ns.METHOD == "PROXIMITY" and ns.CALIBRATE == 1 %}
        {action_raise_error("CALIBRATE=1 requires METHOD=CONTACT")}
    {% endif %}

    _SET_STATUS_HOMING

    # --- No axes specified: home all ---
    {% if not ns.HOME_X and not ns.HOME_Y and not ns.HOME_Z %}
        {% set ns.HOME_X = True %}
        {% set ns.HOME_Y = True %}
        {% set ns.HOME_Z = True %}
    {% endif %}

    # --- X/Y homing ---
    {% if ns.HOME_X or ns.HOME_Y %}
        {% set XY_STR = "" %}
        {% if ns.HOME_X %}
            {% set XY_STR = XY_STR ~ " X" %}
        {% endif %}
        {% if ns.HOME_Y %}
            {% set XY_STR = XY_STR ~ " Y" %}
        {% endif %}

        G28.1 {XY_STR}
    {% endif %}

    # --- Z homing ---
    {% if ns.HOME_Z %}
        {% if ns.METHOD == "CONTACT" %}
            G28.1 Z METHOD=CONTACT CALIBRATE={ns.CALIBRATE}
        {% else %}
            G28.1 Z METHOD=PROXIMITY
        {% endif %}
    {% endif %}

    _SET_STATUS_READY

  

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: BASE_QGL 
description: Quad gantry leveling with final Beacon Contact calibration
gcode:
    _SET_STATUS_HOMING
    CG28

    _SET_STATUS_LEVELING
    BASE_QGL {rawparams}

    _SET_STATUS_CALIBRATING_Z
    G28 Z METHOD=CONTACT CALIBRATE=1

    _SET_STATUS_READY


[gcode_macro MESH_CALIBRATE]
description: Macro to call BED_MESH_CALIBRATE with LED colors for MESHING.
gcode:
    _SET_STATUS_MESHING
    BED_MESH_CALIBRATE ADAPTIVE=1 {rawparams} # USE_CONTACT_AREA=1
    _SET_STATUS_READY


# ---------- DANGER! ----------
# These macros directly override the FIRMWARE_RESTART and RESTART commands.
# Anything may happen! Proceed with utmost caution!
# ---------- DANGER! ----------

[gcode_macro RESTART]
rename_existing: RESTART_BASE
description: Saves kinematic position before restarting Klipper
gcode:
    # --- Save current position ---
    {% set pos = printer.toolhead.position %}
    SAVE_VARIABLE VARIABLE=last_x VALUE={pos.x}
    SAVE_VARIABLE VARIABLE=last_y VALUE={pos.y}
    SAVE_VARIABLE VARIABLE=last_z VALUE={pos.z}
    
    # --- Execute the actual restart ---
    RESPOND PREFIX="🔄" TYPE=command MSG="Saving position and restarting Klipper..."
    RESTART_BASE {rawparams}


[gcode_macro FIRMWARE_RESTART]
rename_existing: FIRMWARE_RESTART_BASE
description: Saves kinematic position before restarting Klipper and MCU
gcode:
    # --- Save current position ---
    {% set pos = printer.toolhead.position %}
    SAVE_VARIABLE VARIABLE=last_x VALUE={pos.x}
    SAVE_VARIABLE VARIABLE=last_y VALUE={pos.y}
    SAVE_VARIABLE VARIABLE=last_z VALUE={pos.z}
    
    # --- Execute the actual firmware restart ---
    RESPOND PREFIX="🔄" TYPE=command MSG="Saving position and restarting firmware..."
    FIRMWARE_RESTART_BASE {rawparams}