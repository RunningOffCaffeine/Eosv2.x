## -------------------------------------------------------
## PRINT START & END
## -------------------------------------------------------

[gcode_macro HEAT_SOAK]
description: Heats the bed (passively heating the chamber), then soaks. [TARGET], [CHAMBER], [DURATION]
variable_target_temp: 0
variable_chamber_target_temp: 0
variable_stage: None # heating_bed -> heating_chamber -> soaking -> done -> None

## in seconds
variable_check_interval: 10
variable_soak_time_remaining: 0
variable_total_time_elapsed: 0

gcode:
    {% set TARGET = params.TARGET | default(0) | float %}
    {% set CHAMBER_TARGET = params.CHAMBER | default(0) | float %}
    {% set DURATION = (params.DURATION | default(5) | int) * 60 %} ## minutes to seconds

    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=target_temp           VALUE={ TARGET }
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=chamber_target_temp   VALUE={ CHAMBER_TARGET }
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=stage                 VALUE="'heating_bed'"
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=soak_time_remaining   VALUE={ DURATION }
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=total_time_elapsed    VALUE=0

    CG28
  
    # Fire up the bed heater
    _SET_STATUS_HEATING
    M140 S{ TARGET }

    # ---> ONE-TIME START MESSAGE <---
    {% set msg = "Starting Heat Soak: Bed %.0fC" | format(TARGET) %}
    {% if CHAMBER_TARGET > 0 %}
        {% set msg = msg ~ ", Chamber %.0fC" | format(CHAMBER_TARGET) %}
    {% endif %}
    {% set msg = msg ~ ", Duration %.0fm" | format(DURATION / 60.0) %}
    
    M117 {msg}
    RESPOND PREFIX="🔥" TYPE=command MSG="{msg}"

    # Run the fan to circulate air
    SET_FAN_SPEED FAN=chamber_filter SPEED=255

    # Park the toolhead
    CENTER

    UPDATE_DELAYED_GCODE ID=heat_soaker DURATION={ check_interval }


[gcode_macro CANCEL_HEAT_SOAK]
description: Cancels an in-progress HEAT_SOAK cycle.
gcode:
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=stage VALUE="'cancel'"
    UPDATE_DELAYED_GCODE ID=heat_soaker DURATION=1


[delayed_gcode heat_soaker]
gcode:
    {% set heat_soak = printer['gcode_macro HEAT_SOAK'] %}

    ## update total time elapsed
    {% set total_time_elapsed = heat_soak.total_time_elapsed + heat_soak.check_interval %}
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=total_time_elapsed VALUE={ total_time_elapsed }

    # Use a namespace so we can actually mutate the state across Jinja scopes
    {% set state = namespace(stage=heat_soak.stage) %}
    
    {% set target_bed = heat_soak.target_temp %}
    {% set target_chamber = heat_soak.chamber_target_temp %}
    {% set soak_time_remaining = heat_soak.soak_time_remaining %}

    # Get the chamber sensor object (must match your config)
    {% set chamber_sensor = printer["temperature_sensor Chamber"] %}

    # --- State Machine ---
    {% if state.stage == "heating_bed" %}
        # Wait for bed to reach temp (with 1C tolerance to account for PID oscillation)
        {% if printer.heater_bed.temperature >= (target_bed - 1.0) %}
            {% if target_chamber > 0 %}
                {% set state.stage = "heating_chamber" %} # Move to check chamber
                
                # ---> ONE-TIME SWITCH TO CHAMBER MESSAGE <---
                {% set msg = "Bed reached %.0fC, heating chamber to %.0fC" | format(target_bed, target_chamber) %}
                M117 {msg}
                RESPOND PREFIX="🔥" TYPE=command MSG="{msg}"
                
            {% else %}
                {% set state.stage = "soaking" %}         # No chamber wait, start soaking
                
                # ---> ONE-TIME START SOAKING MESSAGE <---
                {% set msg = "Heating done, soaking for %.1fm" | format(soak_time_remaining / 60.0) %}
                M117 {msg}
                RESPOND PREFIX="♨️" TYPE=command MSG="{msg}"
            {% endif %}
        {% endif %}

    {% elif state.stage == "heating_chamber" %}
        # Wait for *passive* chamber sensor to reach temp (with 0.5C tolerance)
        {% if chamber_sensor.temperature >= (target_chamber - 0.5) %}
            {% set state.stage = "soaking" %} # Chamber is hot, start soaking
            
            # ---> ONE-TIME START SOAKING MESSAGE <---
            {% set msg = "Chamber reached %.0fC, soaking for %.1fm" | format(target_chamber, soak_time_remaining / 60.0) %}
            M117 {msg}
            RESPOND PREFIX="♨️" TYPE=command MSG="{msg}"
        {% endif %}

    {% elif state.stage == "soaking" %}
        # Countdown soak time
        {% set soak_time_remaining = [soak_time_remaining - heat_soak.check_interval, 0] | max %}
        SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=soak_time_remaining VALUE={ soak_time_remaining }

        {% if soak_time_remaining == 0 %}
            {% set state.stage = "done" %}
        {% endif %}
    {% endif %}

    # Commit the mutated state back to Klipper's global memory
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=stage VALUE="'{ state.stage }'"
    # --- End State Machine ---


    {% if state.stage in ("done", "cancel") %}
        # --- Cleanup ---
        {% if state.stage == "cancel" %}
            {% set state.stage = "done" %}
            TURN_OFF_HEATERS # This will turn off the bed heater
            SET_FAN_SPEED FAN=chamber_filter SPEED=0
            
            {% set msg = "Soak CANCELLED after ~%.1fm" | format(total_time_elapsed / 60.0) %}
            M117 {msg}
            RESPOND PREFIX="⚠️" TYPE=command MSG="{msg}"
            
            # Low tone for cancellation
            M300 P500 S440 
            
            _SET_STATUS_READY
        {% else %}
            {% set msg = "Soak COMPLETE after %.1fm" | format(total_time_elapsed / 60.0) %}
            M117 {msg}
            RESPOND PREFIX="✅" TYPE=command MSG="{msg}"
            
            # Happy double-beep for completion
            M300 P200 S880 
            M300 P200 S1046
            
            _SET_STATUS_READY
        {% endif %}

        ## reset all state vars
        SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=target_temp           VALUE=0
        SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=chamber_target_temp   VALUE=0
        SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=soak_time_remaining   VALUE=0
        SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=total_time_elapsed    VALUE=0

    {% else %}
        # --- Reschedule (Periodic Updates) ---
        
        # Define the message and icon based on current stage
        {% set msg = "" %}
        {% set prefix = "🔥" %}
        
        {% if state.stage == "heating_bed" %}
            {% set msg = "Heating bed (%.0fC) -- %.1fm elapsed" | format(printer.heater_bed.temperature, total_time_elapsed / 60.0) %}
        {% elif state.stage == "heating_chamber" %}
            {% set msg = "Heating chamber (%.0fC) -- %.1fm elapsed" | format(chamber_sensor.temperature, total_time_elapsed / 60.0) %}
        {% elif state.stage == "soaking" %}
            {% set msg = "Soaking -- %.1fm remaining" | format(soak_time_remaining / 60.0) %}
            {% set prefix = "♨️" %} # Switch icon during soak
        {% endif %}

        # 1. Output to Display (M117) every 30 seconds
        {% if total_time_elapsed % 30 == 0 and msg != "" %}
            M117 {msg}
        {% endif %}

        # 2. Output to Console (RESPOND) every 150 seconds (2.5 mins)
        {% if total_time_elapsed % 150 == 0 and msg != "" %}
            RESPOND PREFIX="{prefix}" TYPE=command MSG="{msg}"
        {% endif %}

        ## trigger ourselves again
        UPDATE_DELAYED_GCODE ID=heat_soaker DURATION={ heat_soak.check_interval }

        ## dwell for 1ms to prevent from going idle
        G4 P1

    {% endif %}


[gcode_macro PHASE_1]
description: Sets profiles, heats bed/nozzle to targets, and homes Z.
gcode:
    _SET_STATUS_READY

    # --- Get all slicer parameters ---
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}
    {% set MATERIAL = params.MATERIAL|default("PLA")|upper %}
    {% set NOZZLE_SIZE = params.NOZZLE_SIZE|default(0.4)|float %}
    {% set LAYER_HEIGHT = params.LAYER_HEIGHT|default(0.2)|float %}
    {% set PRINT_SPEED = params.PRINT_SPEED|default(60)|float %}
    {% set TUBE_LENGTH = params.TUBE_LENGTH|default(0.5)|float %}

    # --- NOZZLE SIZE VERIFICATION ---
    {% set KLIPPER_NOZZLE = printer.extruder.nozzle_diameter %}
    {% if (NOZZLE_SIZE - KLIPPER_NOZZLE)|abs > 0.01 %}
        {action_raise_error("Nozzle size mismatch! Slicer: %.2fmm, Printer: %.2fmm." % (NOZZLE_SIZE, KLIPPER_NOZZLE))}
    {% endif %}

    # --- Get Build Sheet State ---
    {% set svv = printer.save_variables.variables %}
    {% set sheet_key = svv.get("build_sheet installed", "") | string %}
    {% set sheet = svv.get(sheet_key, None) %}

    # --- Set initial printer state & filament profiles ---
    M117 Setting material profiles...
    SET_GCODE_OFFSET Z=0 MOVE=1

    # _SET_MPC_MATERIAL MATERIAL={MATERIAL}
    _SET_FIRMWARE_RETRACTION MATERIAL={MATERIAL}
    _CALCULATE_PA MATERIAL={MATERIAL} NOZZLE_SIZE={NOZZLE_SIZE} LAYER_HEIGHT={LAYER_HEIGHT} PRINT_SPEED={PRINT_SPEED} TUBE_LENGTH={TUBE_LENGTH}

    # --- Heating and Homing ---
    BED_MESH_CLEAR
    G28
    M117 Heating bed...
    _SET_STATUS_HEATING
    
    M140 S{BED_TEMP} 
    PARK Z=10
    # --- Nozzle Heating for Probing ---
    M117 Heating nozzle to probe temp...
    {% if sheet and 'smooth' in sheet.name|lower %}
        {action_respond_info("Smooth sheet detected. Heating nozzle to 150°C for probing.")}
        M104 S150
    {% else %}
        {action_respond_info("Textured/Standard sheet detected. Heating nozzle to full temp (" ~ EXTRUDER_TEMP ~ "°C) for probing.")}
        M104 S{EXTRUDER_TEMP}
    {% endif %}
    
    M190 S{BED_TEMP}
    
    {% if sheet and 'smooth' in sheet.name|lower %}
        M109 S150
        G4 P10000
    {% else %}
        M109 S{EXTRUDER_TEMP}
        G4 P10000
    {% endif %}




[gcode_macro PHASE_2]
description: Runs QGL, tunes Beacon to print center, and creates bed mesh.
gcode:
    # --- Bounding Box Center Calculation ---
    {% set PRINT_MIN = params.PRINT_MIN | default("0,0") %}
    {% set PRINT_MAX = params.PRINT_MAX | default("0,0") %}
    {% set min_x = PRINT_MIN.split(",")[0] | float %}
    {% set min_y = PRINT_MIN.split(",")[1] | float %}
    {% set max_x = PRINT_MAX.split(",")[0] | float %}
    {% set max_y = PRINT_MAX.split(",")[1] | float %}

    {% if max_x > 0 and max_y > 0 %}
        {% set center_x = (min_x + max_x) / 2 %}
        {% set center_y = (min_y + max_y) / 2 %}
    {% else %}
        {% set center_x = printer.toolhead.axis_maximum.x / 2 %}
        {% set center_y = printer.toolhead.axis_maximum.y / 2 %}
    {% endif %}

    M117 Wiping nozzle for calibration...
    # PARK_WIPE

    # --- 1. Initial Z Calibration (At Master Center) ---
    M117 Calibrating...
    _SET_STATUS_CALIBRATING_Z
    G28 Z METHOD=PROXIMITY CALIBRATE=0

    # --- 2. QGL ---
    _SET_STATUS_LEVELING
    QUAD_GANTRY_LEVEL

    # --- 3. Final Z Check (At Master Center) ---
    _SET_STATUS_CALIBRATING_Z
    G28 Z  METHOD=CONTACT CALIBRATE=0

    # --- 4. Tune Beacon to Print Area ---
    _SET_STATUS_CALIBRATING_Z
    M117 Tuning Beacon to print area...
    G90
    G0 X{center_x} Y{center_y} F9000
    # This taps the bed at the print center to perfectly calibrate the induction model for this specific spot
    BEACON_AUTO_CALIBRATE

    # --- 5. Bed Mesh ---
    _SET_STATUS_MESHING
    M117 Meshing print area...
    MESH_CALIBRATE RUNS=2


[gcode_macro PHASE_3]
description: Final heating, thermal Z compensation, and purge
gcode:
    # --- Slicer parameters ---
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}

    # --- Build sheet state ---
    {% set svv = printer.save_variables.variables %}
    {% set sheet_key = svv.get("build_sheet installed", "")|string %}
    {% set sheet = svv.get(sheet_key, None) %}

    # --- Final nozzle heating ---
    _SET_STATUS_HEATING
    M117 Final heating...
    M109 S{EXTRUDER_TEMP}

    # Allow thermal stabilization
    G4 P10000

    # --- Nozzle cleaning ---
    # M117 Wiping final ooze...
    # PARK_WIPE

    # --- Thermal expansion compensation ---
    {% if sheet and 'smooth' in sheet.name|lower %}
        # Smooth PEI probed at 150C
        {% set THERMAL_OFFSET = 0.100 %}
        {action_respond_info("Smooth PEI: thermal compensation +0.100mm")}
    {% else %}
        # Textured/standard sheet probed at print temp
        {% set THERMAL_OFFSET = 0.025 %}
        {action_respond_info("Textured/standard: first-layer correction +0.025mm")}
    {% endif %}

    # --- Saved build sheet adjustment ---
    {% set SHEET_OFFSET = sheet.get('offset', 0.0)|float if sheet else 0.0 %}

    # --- Combined final Z offset ---
    {% set TOTAL_OFFSET = THERMAL_OFFSET + SHEET_OFFSET %}

    {action_respond_info("Thermal/initial offset: %.3fmm" % THERMAL_OFFSET)}
    {action_respond_info("Saved sheet offset: %.3fmm" % SHEET_OFFSET)}
    {action_respond_info("Final Z offset: %.3fmm" % TOTAL_OFFSET)}

    SET_GCODE_OFFSET Z={TOTAL_OFFSET} MOVE=1

    # --- Purge ---
    _SET_STATUS_PURGING
    M117 Purging...
    VORON_PURGE

    _SET_STATUS_PRINTING
    M117 Print starting!

[gcode_macro PRINT_END]
gcode:
    END_PRINT {rawparams}

[gcode_macro END_PRINT]
gcode:
    # Move nozzle away from print while retracting
    G91
    G1 Z5 E-2 F800     ; Raise Z by 5mm relative
    G1 E2 F800         ; Extrude slightly (tip shaping)
    G1 E-40 F800       ; Large retract (user defined)

    # Turn off bed, extruder, and fan
    M104 S0
    M106 S0
    
    # Park nozzle at Drip Stop and wipe
    # This automatically moves to absolute coords X45 Y350
#   PARK_WIPE_PARK
    PARK

    G90
    _SET_STATUS_OFF


# -----------------------------------------------------------------------------
# EOS + SO3 | One authoritative PAUSE / RESUME / CANCEL_PRINT implementation.
# Integrates SO3 heater-target restoration, retract, pause timeout and RGB
# indication while retaining EOS drip-stop parking, state handling and macros.
# -----------------------------------------------------------------------------

[gcode_macro PAUSE]
description: Save heater targets, retract, lift and park at the EOS drip stop.
rename_existing: PAUSE_BASE
gcode:
    {% if not printer['pause_resume'].is_paused %}
        {% set sensor = printer['gcode_macro _SENSOR_VARIABLES'] %}
        {% set requested_z = params.Z|default(sensor.park_lift_z)|float|abs %}
        {% set requested_e = params.E|default(sensor.park_retraction)|float|abs %}
        {% set requested_x = params.X|default(sensor.park_position_x)|float %}
        {% set requested_y = params.Y|default(sensor.park_position_y)|float %}
        {% set park_x = [[requested_x, printer.toolhead.axis_minimum.x]|max, printer.toolhead.axis_maximum.x]|min %}
        {% set park_y = [[requested_y, printer.toolhead.axis_minimum.y]|max, printer.toolhead.axis_maximum.y]|min %}
        {% set z_safe = [[requested_z, printer.toolhead.axis_maximum.z - printer.toolhead.position.z]|min, 0]|max %}
        {% set can_retract = printer.extruder.can_extrude %}

        # Store actual requested temperatures, not only a saved filament preset.
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=bed_restore_temp VALUE={printer.heater_bed.target}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=extruder_restore_temp VALUE={printer.extruder.target}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=retract_length VALUE={requested_e if can_retract else 0.0}

        # Let Klipper record its own pause position before we move.
        SAVE_GCODE_STATE NAME=EOS_PAUSE_ORIGINAL
        PAUSE_BASE
        _SET_STATUS_PAUSE
        SET_IDLE_TIMEOUT TIMEOUT={sensor.pause_timeout|int}

        # SO3's retraction, but only when the hotend permits extrusion.
        M83
        {% if can_retract and requested_e > 0 %}
            G1 E-{requested_e} F2100
        {% endif %}
        {% if 'xyz' in printer.toolhead.homed_axes %}
            G91
            {% if z_safe > 0 %}
                G1 Z{z_safe} F900
            {% endif %}
            G90
            G1 X{park_x} Y{park_y} F6000
        {% endif %}

        SAVE_GCODE_STATE NAME=EOS_PAUSE_PARK
        # Keep the bed at its requested temperature; cool the parked nozzle.
        M104 S0
    {% else %}
        {action_respond_info('EOS is already paused.')}
    {% endif %}


[gcode_macro RESUME]
description: Restore SO3 bed/nozzle targets, prime and resume the saved print.
rename_existing: RESUME_BASE
variable_bed_restore_temp: 0.0
variable_extruder_restore_temp: 0.0
variable_retract_length: 0.0
gcode:
    {% if printer['pause_resume'].is_paused %}
        _SET_STATUS_HEATING
        # Restore bed before nozzle so its temperature has settled when we resume.
        {% if bed_restore_temp > 0 %}
            M190 S{bed_restore_temp}
        {% else %}
            M140 S0
        {% endif %}
        {% if extruder_restore_temp > 0 %}
            M109 S{extruder_restore_temp}
        {% else %}
            M104 S0
        {% endif %}

        # Return to the protected lifted park position if filament macros moved us.
        {% if 'xyz' in printer.toolhead.homed_axes %}
            RESTORE_GCODE_STATE NAME=EOS_PAUSE_PARK MOVE=1 MOVE_SPEED=100
        {% else %}
            RESTORE_GCODE_STATE NAME=EOS_PAUSE_PARK MOVE=0
        {% endif %}
        _SET_STATUS_RESUME
        M83
        # Jinja is evaluated before M109 runs. Decide priming from the saved
        # target (not the possibly cold live can_extrude state at macro entry).
        {% if extruder_restore_temp >= printer.configfile.settings.extruder.min_extrude_temp and retract_length > 0 %}
            G1 E{params.E|default(retract_length)|float|abs} F2100
        {% endif %}
        # Restore the original parser state; RESUME_BASE returns to the print.
        RESTORE_GCODE_STATE NAME=EOS_PAUSE_ORIGINAL MOVE=0
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
        RESUME_BASE VELOCITY={params.VELOCITY|default(60)|float}
        _SET_STATUS_PRINTING
    {% else %}
        {action_respond_info('EOS is not paused.')}
    {% endif %}


[gcode_macro CANCEL_PRINT]
description: Safely cancel, shut down both heaters and leave SO3 status red.
rename_existing: CANCEL_PRINT_BASE
gcode:
    # Avoid PRINT_END's long extrusion/retraction moves on a canceled print.
    # Safely lift and park only when axes are homed.
    {% if 'xyz' in printer.toolhead.homed_axes %}
        {% set sensor = printer['gcode_macro _SENSOR_VARIABLES'] %}
        {% set lift = [[sensor.park_lift_z|float, printer.toolhead.axis_maximum.z - printer.toolhead.position.z]|min, 0]|max %}
        {% set park_x = [[sensor.park_position_x|float, printer.toolhead.axis_minimum.x]|max, printer.toolhead.axis_maximum.x]|min %}
        {% set park_y = [[sensor.park_position_y|float, printer.toolhead.axis_minimum.y]|max, printer.toolhead.axis_maximum.y]|min %}
        SAVE_GCODE_STATE NAME=EOS_CANCEL_PARK
        G91
        {% if lift > 0 %}
            G1 Z{lift} F900
        {% endif %}
        G90
        G1 X{park_x} Y{park_y} F6000
        RESTORE_GCODE_STATE NAME=EOS_CANCEL_PARK MOVE=0
    {% endif %}
    TURN_OFF_HEATERS
    M106 S0
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    CLEAR_PAUSE
    CANCEL_PRINT_BASE {rawparams}
    _SET_STATUS_CANCEL


[gcode_macro INTERRUPT_HEATER]
gcode:
    HEATER_INTERRUPT